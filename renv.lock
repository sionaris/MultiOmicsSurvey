      "Title": "wMKL: a weighted multi-kernel learning model",
      "Authors@R": "c(person(\"Hongyan\", \"Cao\", role=c(\"aut\"), email=\"caohy@sxmu.edu.cn\"), person(\"Yuehua\", \"Cui\", role=c(\"aut\", \"cre\"), email=\"cuiy@msu.edu\"))",
