        "BiocStyle",
        "zebrafishRNASeq",
        "testthat"
      ],
      "License": "Artistic-2.0",
      "biocViews": "ImmunoOncology, Microarray, StatisticalMethod, Preprocessing, MultipleComparison, Sequencing, RNASeq, BatchEffect, Normalization",
      "RoxygenNote": "7.0.2",
